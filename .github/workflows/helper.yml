name: Helper zip
# Zips helper/ and puts it in the "releases" storage bucket. No token is in the zip; each PC makes its own on first run.
on:
  push:
    branches: [main]
    paths: ["helper/**", ".github/workflows/helper.yml"]
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip
        run: |
          VER=$(python3 -c "import json;print(json.load(open('helper/package.json'))['version'])")
          echo "VER=$VER" >> "$GITHUB_ENV"
          test ! -e helper/HELPER-TOKEN.txt || (echo "HELPER-TOKEN.txt must not be in the repo" && exit 1)
          mkdir -p out && cp -r helper out/harbor-helper && cd out && zip -r ../harbor-helper.zip harbor-helper && cd ..
          ls -l harbor-helper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-helper-${{ env.VER }}
          path: harbor-helper.zip
      - name: Upload to Supabase storage
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then echo "Supabase upload not configured; skipping"; exit 0; fi
          for NAME in helper/harbor-helper.zip "helper/harbor-helper-$VER.zip"; do
            code=$(curl -sS -o /tmp/up.json -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/releases/$NAME" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/zip" -H "x-upsert: true" --data-binary @harbor-helper.zip)
            cat /tmp/up.json; echo
            if [ "$code" -ge 300 ]; then echo "Upload failed ($code)"; exit 1; fi
          done
          echo "Helper $VER: $SUPABASE_URL/storage/v1/object/public/releases/helper/harbor-helper.zip" >> "$GITHUB_STEP_SUMMARY"
